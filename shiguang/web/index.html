<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f7f9f7">
  <meta name="color-scheme" content="light">
  <title>拾光 · 把重要的事留下</title>
  <link rel="icon" type="image/svg+xml" href="/assets/favicon.svg">
  <link rel="stylesheet" href="/assets/styles.css">
</head>
<body>
  <a class="skip-link" href="#content">跳至工作区</a>
  <div class="app-shell">
    <aside class="sidebar" aria-label="主导航">
      <a class="brand" href="#tasks" aria-label="拾光首页"><span class="brand-symbol"><svg viewBox="0 0 28 28" aria-hidden="true"><path d="M7 5v12a6 6 0 0 0 6 6h9M13 5v12a1 1 0 0 0 1 1h8"/><path d="m17 5 2 4 4 2-4 2-2 4-2-4-4-2 4-2Z"/></svg></span><span>拾光<small>SHIGUANG</small></span></a>
      <button class="search-shortcut" data-action="search" aria-label="搜索待办"><span data-icon="search"></span><span>搜索待办</span><kbd>Ctrl K</kbd></button>
      <div class="nav-label">工作空间</div>
      <nav class="main-nav">
        <a href="#tasks" data-nav="tasks" aria-label="待办事项"><span data-icon="check-circle"></span><span>待办事项</span><span class="nav-count" id="nav-pending">—</span></a>
        <a href="#sessions" data-nav="sessions" aria-label="微信会话"><span data-icon="message"></span><span>微信会话</span></a>
        <a href="#rules" data-nav="rules" aria-label="过滤规则"><span data-icon="filter"></span><span>过滤规则</span></a>
        <a href="#profile" data-nav="profile" aria-label="我的画像"><span data-icon="user"></span><span>我的画像</span></a>
      </nav>
      <div class="sidebar-bottom">
        <div class="connection-card"><div class="connection-top"><span class="connection-dot" id="connection-dot"></span><strong id="connection-label">正在连接服务</strong></div><p id="connection-note">微信消息，自动拾取</p><button class="button small subtle" data-action="wechat" id="connection-action">连接微信<span data-icon="arrow-right"></span></button></div>
        <a class="settings-nav" href="#settings" data-nav="settings" aria-label="设置与数据"><span data-icon="settings"></span><span>设置与数据</span></a>
        <div class="sidebar-signature"><span class="avatar" id="account-avatar">拾</span><span id="account-name">个人工作空间<small>把重要的事留下</small></span><span class="local-mark">LOCAL</span></div>
      </div>
    </aside>
    <main class="main">
      <header class="topbar"><div class="breadcrumb"><span>个人工作空间</span><span class="slash">/</span><strong id="breadcrumb-current">待办事项</strong></div><div class="topbar-right"><span class="live-indicator"><span></span><span id="sync-label">等待同步</span></span><button class="icon-button" data-action="refresh" aria-label="刷新数据" title="刷新数据"><span data-icon="refresh"></span></button></div></header>
      <div id="run-strip" class="run-strip" hidden></div>
      <div id="content" class="workspace" tabindex="-1"><div class="loading-state"><span class="spinner"></span><span>正在打开工作空间</span></div></div>
      <footer class="workspace-footer"><span><span data-icon="leaf"></span>让消息流过，让事情留下。</span><span id="footer-message-count">微信消息 · 本地工作空间</span></footer>
    </main>
  </div>
  <div id="drawer-backdrop" class="drawer-backdrop" hidden></div>
  <aside id="task-drawer" class="task-drawer" role="dialog" aria-modal="true" aria-label="待办详情" tabindex="-1" hidden></aside>
  <div id="modal-root"></div>
  <div id="toast-region" class="toast-region" role="status" aria-live="polite" aria-atomic="false"></div>
  <script type="module" src="/assets/app.js"></script>
</body>
</html>
